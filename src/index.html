<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>Claude Usage</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="rgbfill" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff4d6d"/><stop offset=".35" stop-color="#ffb84d"/>
        <stop offset=".65" stop-color="#4dd8ff"/><stop offset="1" stop-color="#d46dff"/>
      </linearGradient>
      <linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7fb2ff" stop-opacity=".45"/><stop offset="1" stop-color="#7fb2ff" stop-opacity="0"/>
      </linearGradient>
      <path id="wavepath" d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 V 20 H 0 Z"/>
    </defs>
  </svg>

  <main class="glass" id="glass">
    <div class="edge" aria-hidden="true"></div>
    <div class="specular" aria-hidden="true"></div>
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="gtint" aria-hidden="true"></div>
    <div class="rgbglow" aria-hidden="true"><i></i></div>

    <div class="dockbar" aria-hidden="true"></div>

    <!-- compact pill (default state; hover to expand) -->
    <div class="pill" id="pill" aria-label="Claude usage"></div>

    <header class="bar">
      <div class="brand">
        <span class="mark" aria-hidden="true"><img src="box.png" alt=""></span>
        <div class="titles">
          <strong>Claude Usage</strong>
          <small id="org">—</small>
        </div>
      </div>
      <div class="actions">
        <button class="icon" id="btn-refresh" title="รีเฟรช" aria-label="รีเฟรช">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button class="icon" id="btn-color" title="สีของเหลว" aria-label="สีของเหลว">
          <svg viewBox="0 0 24 24"><path d="M12 3.5c3 3.6 5.5 6.6 5.5 9.7a5.5 5.5 0 0 1-11 0c0-3.1 2.5-6.1 5.5-9.7z"/></svg>
        </button>
        <button class="icon" id="btn-menu" title="ตั้งค่า" aria-label="ตั้งค่า">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        </button>
        <button class="icon" id="btn-hide" title="ซ่อน (เปิดได้จาก tray)" aria-label="ซ่อน">
          <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
        </button>
      </div>
    </header>

    <!-- usage view -->
    <section id="view-usage" class="view">
      <div class="orbs" id="orbs"></div>
      <button class="chev" id="btn-chev" type="button" aria-expanded="true" title="ย่อ / ขยายรายละเอียด">
        <span class="chev-mini" id="chev-mini"></span>
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="details" id="details">
        <div class="details-inner">
          <div class="burn" id="burn" hidden></div>
          <div class="rows" id="rows"></div>
          <div class="products" id="products" hidden></div>
        </div>
      </div>
    </section>

    <!-- colour panel -->
    <section id="view-color" class="view colorp" hidden>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="liquid">💧 ของเหลว</button>
        <button type="button" role="tab" data-tab="glass">🔮 กระจก</button>
      </div>
      <div class="seg" id="seg" role="radiogroup" aria-label="โหมดสี"></div>
      <p class="hint" id="mode-hint"></p>
      <div class="swatches" id="swatches">
        <label class="swatch custom" title="เลือกสีเอง"><input type="color" id="color-input" value="#3a7bff"></label>
      </div>
      <label class="speed" id="strength-row"><span>ความเข้มสี</span>
        <input type="range" id="strength" min="10" max="100" step="5" value="55"><em id="strength-val"></em></label>
      <label class="speed" id="speed-row"><span>ความเร็ว RGB</span>
        <input type="range" id="speed" min="2" max="30" step="1" value="8"><em id="speed-val"></em></label>
      <label class="check" id="warn-row"><input type="checkbox" id="warn" checked> <span>เปลี่ยนเป็นสีแดงเมื่อใช้เกิน 90%</span></label>
      <button class="pill primary" id="btn-color-done" type="button">เสร็จ</button>
    </section>

    <!-- auth view -->
    <section id="view-auth" class="view auth" hidden>
      <div class="auth-orb" aria-hidden="true"><span></span></div>
      <h2>เชื่อมบัญชี claude.ai</h2>
      <p>ล็อกอินด้วย <b>อีเมล</b> (ใช้อีเมลเดียวกับ Google ได้) — ปุ่ม Google ใช้ในแอปไม่ได้เพราะ Google บล็อก</p>
      <button class="pill primary" id="btn-login">ล็อกอินด้วยอีเมล</button>
      <button class="link" id="btn-show-key">ใช้ Google อยู่? ดึง sessionKey จากเบราว์เซอร์แทน</button>
      <form id="key-form" class="key" hidden>
        <ol class="steps">
          <li><button type="button" class="link inline" id="btn-open-browser">เปิด claude.ai ในเบราว์เซอร์</button> (ที่ล็อกอิน Google ไว้แล้ว)</li>
          <li>กด <b>F12</b> → แท็บ <b>Application</b> → Cookies → claude.ai</li>
          <li>ดับเบิลคลิกค่า <b>sessionKey</b> → Ctrl+C</li>
        </ol>
        <input id="key-input" type="password" placeholder="sk-ant-sid01-…" autocomplete="off" spellcheck="false">
        <button class="pill" type="submit">บันทึก</button>
        <button class="pill wide" type="button" id="btn-paste">วางจากคลิปบอร์ด</button>
        <small id="key-msg"></small>
      </form>
    </section>

    <div class="pets" id="pets" aria-hidden="true"></div>

    <footer class="foot" id="foot">
      <span id="updated">กำลังโหลด…</span>
      <button class="link" id="btn-open">claude.ai ↗</button>
    </footer>
  </main>

  <script src="pets.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
