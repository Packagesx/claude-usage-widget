name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # only the highest version tag becomes "Latest release",
      # even if several tag builds finish in a different order
      - name: Is this the newest tag?
        id: latest
        shell: bash
        run: |
          newest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "make_latest=$([ "$newest" = "${GITHUB_REF_NAME}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
          generate_release_notes: true
          make_latest: ${{ steps.latest.outputs.make_latest }}
